<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Mi Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding ion-text-center">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Mi Perfil</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="profile-header ion-margin-top ion-padding">
    <ion-avatar style="width: 110px; height: 110px; margin: 0 auto;">
      <div style="background-color: var(--ion-color-primary-tint); width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
        <ion-icon name="person-outline" color="primary" style="font-size: 54px;"></ion-icon>
      </div>
    </ion-avatar>

    <h2 class="ion-margin-top">{{ nombre }}</h2>
    <p style="color: var(--ion-color-medium);">{{ correo }}</p>

    <ion-chip color="primary">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
      <ion-label style="text-transform: uppercase; font-weight: bold;">{{ rol }}</ion-label>
    </ion-chip>
  </div>

  <ion-list lines="inset" class="ion-margin-top">
    <ion-item>
      <ion-icon name="school-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h3>Institución</h3>
        <p>Universidad Tecnológica de Gutiérrez Zamora</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="calendar-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <h3>Cuatrimestre</h3>
        <p>Cuatrimestre 10 - Unidad 2</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="ion-padding ion-margin-top">
    <ion-button expand="block" color="danger" fill="outline" shape="round" (click)="cerrarSesion()">
      <ion-icon name="log-out-outline" slot="start"></ion-icon>
      Cerrar Sesión
    </ion-button>
  </div>

</ion-content>
